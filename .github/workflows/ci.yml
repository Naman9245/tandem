name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `next build` also type-checks. The values only need to exist; nothing
      # is fetched at build time.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  supabase:
    name: RLS and edge function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Auth, REST, edge functions and the mail catcher are all the tests need.
      - run: npx supabase start -x studio,imgproxy,storage-api,realtime,logflare,vector,supavisor,postgres-meta
      - run: npm run test:db
      - run: npm run test:e2e
