<h2>Reset your Tandem password</h2>

<p>Someone (hopefully you) asked to reset the password for {{ .Email }}.</p>

<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/set-password">Choose a new password</a></p>

<p>If you didn't ask for this, you can ignore the email. Your password won't change.</p>
